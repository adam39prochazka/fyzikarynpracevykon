<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Práce & výkon – fyzika 8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;800;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#050816;--tx:#eaf6ff;--cy:#35f2ff;--a:#35f2ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:'Rajdhani',system-ui,sans-serif;font-weight:600;font-size:1.15rem;color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:hidden}
h1,h2,.or{font-family:'Exo 2','Segoe UI',sans-serif}
.gr{position:fixed;inset:-40% -20% 0;z-index:-3;background-image:linear-gradient(#35f2ff1c 1px,transparent 1px),linear-gradient(90deg,#35f2ff1c 1px,transparent 1px);background-size:54px 54px;transform:perspective(420px) rotateX(62deg);animation:gm 2.4s linear infinite;mask-image:linear-gradient(transparent,#000 40%)}
@keyframes gm{to{background-position:0 54px}}
.ob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:-2;animation:ob 16s ease-in-out infinite alternate}
@keyframes ob{to{transform:translate(35vw,25vh) scale(1.5)}}
#sy{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#sy span{position:absolute;bottom:-10vh;font-family:'Exo 2',sans-serif;color:var(--cy);opacity:.18;animation:up linear infinite;text-shadow:0 0 12px var(--cy)}
@keyframes up{to{transform:translateY(-120vh) rotate(var(--r))}}
.s{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:64px 16px 28px;text-align:center}.s.on{display:flex;animation:in .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.96)}}
.t{font-size:clamp(2rem,7vw,4.2rem);font-weight:900;line-height:1;background:linear-gradient(90deg,#35f2ff,#b46bff,#ff4d8d,#ffd43b,#35f2ff);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tg 5s linear infinite;filter:drop-shadow(0 0 18px #35f2ff66)}
@keyframes tg{to{background-position:300%}}
.sub{font-size:1.2rem;opacity:.85;letter-spacing:.04em}
.fm{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.fm b{font-family:'Exo 2',sans-serif;font-size:.8rem;padding:6px 12px;border-radius:30px;border:1px solid #35f2ff66;background:#35f2ff14;box-shadow:0 0 14px #35f2ff33;animation:pu 2.4s ease-in-out infinite}.fm b:nth-child(2){animation-delay:.4s}.fm b:nth-child(3){animation-delay:.8s}
@keyframes pu{50%{box-shadow:0 0 26px #35f2ffaa;transform:scale(1.05)}}
.lv{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.lc{width:min(260px,88vw);padding:22px 16px;border-radius:22px;border:2px solid var(--c);background:linear-gradient(160deg,#ffffff14,#ffffff05);color:#fff;cursor:pointer;font:inherit;backdrop-filter:blur(10px);box-shadow:0 0 24px color-mix(in srgb,var(--c) 40%,transparent);transition:.25s;position:relative;overflow:hidden}
.lc:hover{transform:translateY(-8px) scale(1.05);box-shadow:0 0 50px var(--c)}
.lc::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,#fff4 50%,transparent 60%);transform:translateX(-120%);animation:sh 3.5s infinite}
@keyframes sh{to{transform:translateX(120%)}}
.lc h2{font-size:1.4rem;color:var(--c)}.lc small{display:block;margin-top:6px;opacity:.8;font-size:1rem}
.pp{display:flex;gap:5px;justify-content:center;margin-top:12px}.pp i{width:12px;height:26px;border-radius:4px;background:#fff3}.pp i.f{background:var(--c);box-shadow:0 0 10px var(--c);animation:bar 1.2s ease-in-out infinite alternate}.pp i:nth-child(2n).f{animation-delay:.3s}
@keyframes bar{to{transform:scaleY(.55)}}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;width:min(980px,100%)}
.tc{position:relative;height:170px;border-radius:22px;overflow:hidden;border:2px solid var(--a);cursor:pointer;color:#fff;font:inherit;padding:0;background:#000;transition:transform .2s,box-shadow .3s;box-shadow:0 0 22px color-mix(in srgb,var(--a) 45%,transparent);animation:fl 5s ease-in-out infinite alternate;transform-style:preserve-3d}
.tc:nth-child(2n){animation-delay:-2s}.tc:nth-child(3n){animation-delay:-3.5s}
@keyframes fl{to{margin-top:7px}}
.tc:hover{box-shadow:0 0 55px var(--a)}
.tc img,.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 12s ease-in-out infinite alternate}
.tc img{transition:.4s}.tc:hover img{filter:saturate(1.5) brightness(1.1)}
@keyframes kb{to{transform:scale(1.15) translate(-2%,-2%)}}
.tc::after,.bn::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 20%,#000d),linear-gradient(120deg,color-mix(in srgb,var(--a) 45%,transparent),transparent 60%)}
.tc div{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;text-align:left}
.tc h2{font-size:1.15rem;text-shadow:0 0 14px var(--a),0 2px 4px #000}.tc small{font-size:.95rem;opacity:.92}
.bn{position:relative;width:min(720px,100%);height:120px;border-radius:20px;overflow:hidden;border:2px solid var(--a);box-shadow:0 0 30px color-mix(in srgb,var(--a) 50%,transparent)}
.bn h2{position:absolute;z-index:2;left:16px;bottom:10px;font-size:1.3rem;text-shadow:0 0 14px var(--a),0 2px 4px #000}
.pg{display:flex;gap:6px;width:min(720px,100%)}.pg i{flex:1;height:10px;border-radius:6px;background:#fff2;transition:.4s}.pg i.d{background:var(--a);box-shadow:0 0 12px var(--a)}.pg i.x{background:#ff4d6d;box-shadow:0 0 12px #ff4d6d}.pg i.c{background:#fff6;animation:pu2 1s infinite}
@keyframes pu2{50%{background:var(--a)}}
.q{width:min(720px,100%);padding:22px 20px;border-radius:22px;background:#0b1230cc;border:2px solid #ffffff30;backdrop-filter:blur(12px);font-size:1.45rem;line-height:1.35;transition:.3s}
.q.ok{border-color:#3dff8b;box-shadow:0 0 50px #3dff8b88;animation:jp .5s}.q.no{border-color:#ff4d6d;box-shadow:0 0 40px #ff4d6d88;animation:sk .5s}
@keyframes jp{40%{transform:translateY(-16px) scale(1.03)}}@keyframes sk{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.in{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.in input{width:180px;font:900 1.8rem 'Exo 2',sans-serif;text-align:center;color:#fff;background:#000a;border:2px solid var(--a);border-radius:14px;padding:10px;outline:none;box-shadow:0 0 18px color-mix(in srgb,var(--a) 50%,transparent)}.in input:focus{box-shadow:0 0 34px var(--a)}
.in span{font:800 1.6rem 'Exo 2',sans-serif;color:var(--a)}
.b{font:800 1.1rem 'Exo 2',sans-serif;padding:13px 32px;border-radius:40px;border:0;color:#041;background:linear-gradient(90deg,#35f2ff,#3dff8b);cursor:pointer;box-shadow:0 0 24px #35f2ff88;transition:.2s}.b:hover{transform:scale(1.08)}
.b.g{background:#ffffff1c;color:#fff;border:1px solid #fff5;box-shadow:none}
#bk{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:5;padding:7px 18px;display:none}
.fb{min-height:30px;font-size:1.35rem}.fb em{font-style:normal;color:#ffd43b}
.big{font:900 clamp(3rem,12vw,6rem) 'Exo 2',sans-serif;animation:pop .8s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(0)}}
.er{width:min(720px,100%);text-align:left;font-size:1.05rem;padding:10px 14px;border-radius:12px;background:#ff4d6d18;border-left:4px solid #ff4d6d}.er b{color:#ffd43b;white-space:nowrap}
.pt{position:fixed;z-index:9;pointer-events:none;font:900 1.8rem 'Exo 2',sans-serif;color:var(--a);text-shadow:0 0 12px var(--a);animation:bu .9s ease-out forwards}
@keyframes bu{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){#sy,.gr,.ob{display:none}*{animation:none!important}}
</style></head><body>
